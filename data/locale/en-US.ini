Coverage.Help="How much of the picture the palette takes over. At 100% no source colour shows through while the lock is on. Breathing and random-off only ever dip below this value, never above it."
InputBlack="Input black"
InputBlack.Help="Source brightness at or below this maps to the palette's first (darkest) colour."
InputWhite="Input white"
InputWhite.Help="Source brightness at or above this maps to the palette's last colour. Lower it to reach the top of the palette on dim or coloured scenes."
