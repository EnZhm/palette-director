BrightnessFrom.Average="Average of R, G, B"
BrightnessFrom.Help="How a source pixel picks its place on the palette. Perceived makes saturated blues very dark; Max treats any fully saturated colour as bright."
Contrast="Contrast"
Contrast.Help="Spreads source brightness around the middle before mapping (1 = unchanged)."
KeepBrightness="Keep brightness"
KeepBrightness.Help="Mixes the source brightness back into the palette colour. 0 = palette colours exactly; higher values can clip towards white."
